[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-competition-mentor"
version = "0.1.0"
description = "Research-oriented system for competition requirement matrix, competency mapping, and evaluation."
authors = [{ name = "AI Competition Mentor Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0.30",
    "pymupdf>=1.24.0",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

